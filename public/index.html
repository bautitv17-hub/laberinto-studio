
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juego Online</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* =========================
   MENÚ
========================= */

#menu {
    width: 400px;
    max-width: 90%;
    margin: 60px auto;
    background: #2c3038;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

#menu h1 {
    margin-bottom: 20px;
}

#menu h2 {
    margin-top: 10px;
}

input,
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

input {
    outline: none;
    text-transform: uppercase;
}

button {
    background: #4caf50;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

hr {
    margin: 25px 0;
    border: none;
    border-top: 1px solid #555;
}

#mensaje {
    color: #ffd166;
    margin-top: 15px;
}

/* =========================
   JUEGO
========================= */

#juego {
    display: none;
    width: 100vw;
    height: 100vh;
    text-align: center;
}

#informacion {
    height: 75px;
    padding: 8px;
}

#informacion h2 {
    margin-bottom: 5px;
}

#informacion p {
    display: inline-block;
    margin: 0 10px;
}

#codigoSala {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 4px;
}

/* =========================
   CANVAS
========================= */

#cancha {
    display: block;
    margin: 0 auto;
    background: #000;
    image-rendering: pixelated;

    max-width: 100vw;
    max-height: calc(100vh - 75px);
}

</style>

</head>


<body>


<!-- =====================================================
     MENÚ
===================================================== -->

<div id="menu">

    <h1>🎮 Juego Online</h1>

    <h2>Crear sala</h2>

    <button id="crearSala">
        Crear sala
    </button>

    <hr>

    <h2>Unirse a una sala</h2>

    <input
        id="codigoInput"
        maxlength="5"
        placeholder="Código de sala"
        autocomplete="off"
    >

    <button id="unirseSala">
        Unirse a sala
    </button>

    <p id="mensaje"></p>

</div>


<!-- =====================================================
     JUEGO
===================================================== -->

<div id="juego">

    <div id="informacion">

        <h2>
            Sala:
            <span id="codigoSala"></span>
        </h2>

        <p>
            Jugadores:
            <span id="cantidadJugadores">0</span>/4
        </p>

        <p>
            WASD / Flechas para moverte
        </p>

    </div>

    <canvas id="cancha"></canvas>

</div>


<script src="/socket.io/socket.io.js"></script>


<script>

/* =====================================================
   SOCKET
===================================================== */

const socket = io();


/* =====================================================
   ELEMENTOS
===================================================== */

const menu =
    document.getElementById("menu");

const juego =
    document.getElementById("juego");

const crearSala =
    document.getElementById("crearSala");

const unirseSala =
    document.getElementById("unirseSala");

const codigoInput =
    document.getElementById("codigoInput");

const codigoSala =
    document.getElementById("codigoSala");

const cantidadJugadores =
    document.getElementById("cantidadJugadores");

const mensaje =
    document.getElementById("mensaje");


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("cancha");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   MAPA
===================================================== */

const CELL = 20;

const MAP = [

"#######################################",
"#P        #       #       #          #",
"#         #       #       #          #",
"#         #       #       #          #",
"#         ###     #     ###      ######",
"#                                   ##",
"#                                   ##",
"###   #########       #########    ##",
"#     #                         #    #",
"#     #       ###########       #    #",
"#     #       #         #       #    #",
"#             #         #            #",
"#             #         #            #",
"#     #       #         #       #    #",
"#     #       ###########       #    #",
"#     #                         #    #",
"###   #########       #########    ##",
"#                                   ##",
"#                                   ##",
"#         ###     #     ###         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#                                   ##",
"#      ######           ######      ##",
"#      #                     #      ##",
"#      #                     #      ##",
"#                                   ##",
"#                                   ##",
"#######################################"

];


const ROWS = MAP.length;
const COLS = MAP[0].length;


canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;


/* =====================================================
   JUGADOR LOCAL
===================================================== */

let miId = null;

const player = {

    x: 0,
    y: 0,

    radius: 8,

    speed: 220,

    directionX: 0,
    directionY: 0

};


/* =====================================================
   JUGADORES ONLINE

   SIEMPRE SERÁ UN ARRAY
===================================================== */

let jugadores = [];


/* =====================================================
   POSICIÓN INICIAL
===================================================== */

function findPlayerStart() {

    for (
        let y = 0;
        y < ROWS;
        y++
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            if (MAP[y][x] === "P") {

                player.x =
                    x * CELL + CELL / 2;

                player.y =
                    y * CELL + CELL / 2;

                return;

            }

        }

    }

}

findPlayerStart();


/* =====================================================
   CONEXIÓN
===================================================== */

socket.on("connect", () => {

    miId = socket.id;

    console.log(
        "Conectado al servidor:",
        miId
    );

});


socket.on("connect_error", (error) => {

    console.error(
        "Error de conexión:",
        error
    );

    mensaje.textContent =
        "No se pudo conectar al servidor.";

});


/* =====================================================
   CREAR SALA
===================================================== */

crearSala.addEventListener(
    "click",
    () => {

        mensaje.textContent =
            "Creando sala...";

        socket.emit(
            "crearSala"
        );

    }
);


/* =====================================================
   UNIRSE A SALA
===================================================== */

unirseSala.addEventListener(
    "click",
    () => {

        const codigo =
            codigoInput.value
                .trim()
                .toUpperCase();


        if (codigo === "") {

            mensaje.textContent =
                "Escribí un código.";

            return;

        }


        mensaje.textContent =
            "Conectando...";


        socket.emit(
            "unirseSala",
            codigo
        );

    }
);


/* =====================================================
   ENTRAR AL JUEGO
===================================================== */

socket.on(
    "salaCreada",
    (datos) => {

        entrarAlJuego(datos);

    }
);


socket.on(
    "salaUnida",
    (datos) => {

        entrarAlJuego(datos);

    }
);


function entrarAlJuego(datos) {

    menu.style.display =
        "none";

    juego.style.display =
        "block";


    if (datos && datos.codigo) {

        codigoSala.textContent =
            datos.codigo;

    }


    if (
        datos &&
        typeof datos.jugadores === "number"
    ) {

        cantidadJugadores.textContent =
            datos.jugadores;

    }


    mensaje.textContent = "";

}


/* =====================================================
   ACTUALIZAR JUGADORES

   ESTA PARTE ES LA QUE EVITA
   EL ERROR .find / .forEach
===================================================== */

socket.on(
    "actualizarJugadores",
    (listaRecibida) => {

        console.log(
            "Jugadores recibidos:",
            listaRecibida
        );


        /*
         * Asegurarnos de que sea un array.
         */

        if (
            Array.isArray(listaRecibida)
        ) {

            jugadores =
                listaRecibida;

        }

        /*
         * Por seguridad, si el servidor
         * manda un objeto con una propiedad
         * jugadores, también lo aceptamos.
         */

        else if (
            listaRecibida &&
            Array.isArray(
                listaRecibida.jugadores
            )
        ) {

            jugadores =
                listaRecibida.jugadores;

        }

        /*
         * Si llega cualquier otra cosa,
         * usamos un array vacío.
         */

        else {

            console.warn(
                "Formato incorrecto recibido:",
                listaRecibida
            );

            jugadores = [];

        }


        /*
         * Actualizar contador.
         */

        cantidadJugadores.textContent =
            jugadores.length;


        /*
         * Buscar nuestro jugador.
         */

        const yo =
            jugadores.find(
                jugador =>
                    jugador &&
                    jugador.id === miId
            );


        if (yo) {

            /*
             * Comprobar que tenga coordenadas.
             */

            if (
                typeof yo.x === "number" &&
                typeof yo.y === "number"
            ) {

                const diferenciaX =
                    Math.abs(
                        yo.x - player.x
                    );


                const diferenciaY =
                    Math.abs(
                        yo.y - player.y
                    );


                /*
                 * Solo corregir si hay una
                 * diferencia grande.
                 */

                if (
                    diferenciaX > 80 ||
                    diferenciaY > 80
                ) {

                    player.x =
                        yo.x;

                    player.y =
                        yo.y;

                }

            }

        }

    }
);


/* =====================================================
   ERROR DE SALA
===================================================== */

socket.on(
    "errorSala",
    (texto) => {

        mensaje.textContent =
            texto;

    }
);


/* =====================================================
   TECLADO
===================================================== */

const keys = {

    up: false,
    down: false,
    left: false,
    right: false

};


document.addEventListener(
    "keydown",
    (event) => {

        const key =
            event.key.toLowerCase();


        if (
            key === "w" ||
            key === "a" ||
            key === "s" ||
            key === "d" ||
            key === "arrowup" ||
            key === "arrowdown" ||
            key === "arrowleft" ||
            key === "arrowright"
        ) {

            event.preventDefault();

        }


        if (
            key === "w" ||
            key === "arrowup"
        ) {

            keys.up = true;

        }


        if (
            key === "s" ||
            key === "arrowdown"
        ) {

            keys.down = true;

        }


        if (
            key === "a" ||
            key === "arrowleft"
        ) {

            keys.left = true;

        }


        if (
            key === "d" ||
            key === "arrowright"
        ) {

            keys.right = true;

        }


        updateDirection();

    }
);


document.addEventListener(
    "keyup",
    (event) => {

        const key =
            event.key.toLowerCase();


        if (
            key === "w" ||
            key === "arrowup"
        ) {

            keys.up = false;

        }


        if (
            key === "s" ||
            key === "arrowdown"
        ) {

            keys.down = false;

        }


        if (
            key === "a" ||
            key === "arrowleft"
        ) {

            keys.left = false;

        }


        if (
            key === "d" ||
            key === "arrowright"
        ) {

            keys.right = false;

        }


        updateDirection();

    }
);


/* =====================================================
   DIRECCIÓN
===================================================== */

function updateDirection() {

    let dx = 0;
    let dy = 0;


    if (keys.left) {
        dx--;
    }

    if (keys.right) {
        dx++;
    }

    if (keys.up) {
        dy--;
    }

    if (keys.down) {
        dy++;
    }


    /*
     * Normalizar diagonal.
     */

    if (
        dx !== 0 &&
        dy !== 0
    ) {

        const length =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        dx /= length;
        dy /= length;

    }


    player.directionX =
        dx;

    player.directionY =
        dy;

}


/* =====================================================
   DETECTAR PARED
===================================================== */

function isWall(x, y) {

    const col =
        Math.floor(
            x / CELL
        );


    const row =
        Math.floor(
            y / CELL
        );


    if (
        row < 0 ||
        row >= ROWS ||
        col < 0 ||
        col >= COLS
    ) {

        return true;

    }


    return MAP[row][col] === "#";

}


/* =====================================================
   COLISIONES
===================================================== */

function canMove(x, y) {

    const r =
        player.radius;


    return (

        !isWall(
            x - r,
            y - r
        )

        &&

        !isWall(
            x + r,
            y - r
        )

        &&

        !isWall(
            x - r,
            y + r
        )

        &&

        !isWall(
            x + r,
            y + r
        )

    );

}


/* =====================================================
   MOVIMIENTO
===================================================== */

function updatePlayer(delta) {

    if (
        juego.style.display === "none"
    ) {

        return;

    }


    const moveX =
        player.directionX *
        player.speed *
        delta;


    const moveY =
        player.directionY *
        player.speed *
        delta;


    const nextX =
        player.x +
        moveX;


    if (
        canMove(
            nextX,
            player.y
        )
    ) {

        player.x =
            nextX;

    }


    const nextY =
        player.y +
        moveY;


    if (
        canMove(
            player.x,
            nextY
        )
    ) {

        player.y =
            nextY;

    }


    /*
     * Mandar posición solamente
     * cuando nos estamos moviendo.
     */

    if (
        player.directionX !== 0 ||
        player.directionY !== 0
    ) {

        socket.emit(
            "moverJugador",
            {
                x: player.x,
                y: player.y
            }
        );

    }

}


/* =====================================================
   DIBUJAR MAPA
===================================================== */

function drawMap() {

    for (
        let y = 0;
        y < ROWS;
        y++
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            const tile =
                MAP[y][x];


            if (tile === "#") {

                ctx.fillStyle =
                    "#28105f";


                ctx.fillRect(
                    x * CELL,
                    y * CELL,
                    CELL,
                    CELL
                );


                ctx.strokeStyle =
                    "#713cff";


                ctx.lineWidth = 2;


                ctx.strokeRect(
                    x * CELL + 1,
                    y * CELL + 1,
                    CELL - 2,
                    CELL - 2
                );

            }

            else {

                ctx.fillStyle =
                    "#000";


                ctx.fillRect(
                    x * CELL,
                    y * CELL,
                    CELL,
                    CELL
                );

            }

        }

    }

}


/* =====================================================
   DIBUJAR JUGADOR
===================================================== */

function drawPlayer(
    x,
    y,
    color,
    nombre
) {

    /*
     * Aura
     */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        14,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        color === "#ffff00"
            ? "rgba(255,255,0,0.15)"
            : "rgba(255,0,0,0.15)";

    ctx.fill();


    /*
     * Cuerpo
     */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        color;

    ctx.fill();


    /*
     * Borde

     */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "#fff";

    ctx.lineWidth = 2;

    ctx.stroke();


    /*
     * Brillo
     */

    ctx.beginPath();

    ctx.arc(
        x - 2.5,
        y - 2.5,
        2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#fff";

    ctx.fill();


    /*
     * Nombre
     */

    ctx.font =
        "bold 11px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "#fff";

    ctx.fillText(
        nombre,
        x,
        y - 15
    );

}


/* =====================================================
   DIBUJAR JUGADORES
===================================================== */

function drawPlayers() {

    /*
     * Seguridad.
     */

    if (
        !Array.isArray(jugadores)
    ) {

        return;

    }


    /*
     * Jugadores remotos.
     */

    jugadores.forEach(
        (jugador, indice) => {

            if (!jugador) {
                return;
            }


            if (
                jugador.id === miId
            ) {

                return;

            }


            if (
                typeof jugador.x !== "number" ||
                typeof jugador.y !== "number"
            ) {

                return;

            }


            drawPlayer(
                jugador.x,
                jugador.y,
                "#e74c3c",
                "JUGADOR " +
                (indice + 1)
            );

        }
    );


    /*
     * Nuestro jugador.
     */

    drawPlayer(
        player.x,
        player.y,
        "#ffff00",
        "YO"
    );

}


/* =====================================================
   DIBUJAR TODO
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawMap();

    drawPlayers();

}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime =
    performance.now();


function gameLoop(currentTime) {

    let delta =
        (currentTime - lastTime) /
        1000;


    lastTime =
        currentTime;


    if (delta > 0.05) {

        delta = 0.05;

    }


    updatePlayer(delta);

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);

</script>

</body>

</html>
