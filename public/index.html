<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juego Online</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* =========================
   MENÚ
========================= */

#menu {
    width: 400px;
    max-width: 90%;
    margin: 80px auto;
    padding: 30px;
    background: #222;
    border-radius: 15px;
    text-align: center;
}

#menu h1 {
    margin-bottom: 25px;
}

#menu h2 {
    margin-top: 15px;
    margin-bottom: 10px;
}

#menu input,
#menu button {
    width: 100%;
    height: 45px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

#menu input {
    padding: 10px;
    text-align: center;
    text-transform: uppercase;
}

#menu button {
    background: #4caf50;
    color: white;
    cursor: pointer;
}

#menu button:hover {
    background: #43a047;
}

#mensaje {
    margin-top: 15px;
    min-height: 20px;
    color: #ffd166;
}

hr {
    border: 0;
    border-top: 1px solid #555;
    margin: 25px 0;
}

/* =========================
   JUEGO
========================= */

#juego {
    display: none;
    width: 100vw;
    height: 100vh;
}

#informacion {
    height: 70px;
    text-align: center;
    padding-top: 8px;
}

#informacion h2 {
    margin-bottom: 5px;
}

#codigoSala {
    color: #00ff88;
    letter-spacing: 4px;
}

#cancha {
    display: block;
    margin: 0 auto;
    background: #000;
    image-rendering: pixelated;

    max-width: 100vw;
    max-height: calc(100vh - 70px);
}

</style>

</head>

<body>


<!-- =========================
     MENÚ
========================= -->

<div id="menu">

    <h1>🎮 Juego Online</h1>

    <h2>Crear una sala</h2>

    <button id="crearSala">
        CREAR SALA
    </button>

    <hr>

    <h2>Unirse a una sala</h2>

    <input
        id="codigoInput"
        type="text"
        maxlength="5"
        placeholder="CÓDIGO DE SALA"
        autocomplete="off"
    >

    <button id="unirseSala">
        UNIRSE A LA SALA
    </button>

    <div id="mensaje"></div>

</div>


<!-- =========================
     JUEGO
========================= -->

<div id="juego">

    <div id="informacion">

        <h2>
            SALA:
            <span id="codigoSala">-----</span>
        </h2>

        <div>
            Jugadores:
            <span id="cantidadJugadores">0</span>/4
        </div>

    </div>

    <canvas id="cancha"></canvas>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

/* =====================================================
   SOCKET.IO
===================================================== */

const socket = io();


/* =====================================================
   ELEMENTOS
===================================================== */

const menu =
    document.getElementById("menu");

const juego =
    document.getElementById("juego");

const crearSala =
    document.getElementById("crearSala");

const unirseSala =
    document.getElementById("unirseSala");

const codigoInput =
    document.getElementById("codigoInput");

const mensaje =
    document.getElementById("mensaje");

const codigoSala =
    document.getElementById("codigoSala");

const cantidadJugadores =
    document.getElementById("cantidadJugadores");

const canvas =
    document.getElementById("cancha");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   MAPA
===================================================== */

const CELL = 20;

const MAP = [

"#######################################",
"#P        #       #       #          #",
"#         #       #       #          #",
"#         #       #       #          #",
"#         ###     #     ###      ######",
"#                                   ##",
"#                                   ##",
"###   #########       #########    ##",
"#     #                         #    #",
"#     #       ###########       #    #",
"#     #       #         #       #    #",
"#             #         #            #",
"#             #         #            #",
"#     #       #         #       #    #",
"#     #       ###########       #    #",
"#     #                         #    #",
"###   #########       #########    ##",
"#                                   ##",
"#                                   ##",
"#         ###     #     ###         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#                                   ##",
"#      ######           ######      ##",
"#      #                     #      ##",
"#      #                     #      ##",
"#                                   ##",
"#                                   ##",
"#######################################"

];


const ROWS = MAP.length;
const COLS = MAP[0].length;

canvas.width =
    COLS * CELL;

canvas.height =
    ROWS * CELL;


/* =====================================================
   VARIABLES
===================================================== */

let miId = null;

let salaActual = null;

let jugadores = [];


/* =====================================================
   JUGADOR
===================================================== */

const player = {

    x: 30,
    y: 30,

    radius: 8,

    speed: 220,

    dx: 0,
    dy: 0

};


/* =====================================================
   BUSCAR POSICIÓN INICIAL
===================================================== */

function buscarInicio() {

    for (
        let y = 0;
        y < ROWS;
        y++
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            if (
                MAP[y][x] === "P"
            ) {

                player.x =
                    x * CELL +
                    CELL / 2;

                player.y =
                    y * CELL +
                    CELL / 2;

                return;
            }

        }

    }

}

buscarInicio();


/* =====================================================
   CONEXIÓN
===================================================== */

socket.on(
    "connect",
    () => {

        miId =
            socket.id;

        console.log(
            "Conectado:",
            miId
        );

    }
);


socket.on(
    "connect_error",
    () => {

        mensaje.textContent =
            "No se pudo conectar al servidor.";

    }
);


/* =====================================================
   CREAR SALA
===================================================== */

crearSala.addEventListener(
    "click",
    () => {

        mensaje.textContent =
            "Creando sala...";

        socket.emit(
            "crearSala"
        );

    }
);


/* =====================================================
   UNIRSE
===================================================== */

unirseSala.addEventListener(
    "click",
    unirse
);


codigoInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            unirse();

        }

    }
);


function unirse() {

    const codigo =
        codigoInput.value
            .trim()
            .toUpperCase();


    if (
        codigo.length !== 5
    ) {

        mensaje.textContent =
            "El código debe tener 5 caracteres.";

        return;
    }


    mensaje.textContent =
        "Entrando a la sala...";


    socket.emit(
        "unirseSala",
        codigo
    );

}


/* =====================================================
   SALA CREADA
===================================================== */

socket.on(
    "salaCreada",
    datos => {

        console.log(
            "Sala creada:",
            datos
        );


        if (
            !datos ||
            !datos.codigo
        ) {

            mensaje.textContent =
                "Error creando la sala.";

            return;
        }


        entrarAlJuego(
            datos.codigo
        );

    }
);


/* =====================================================
   SALA UNIDA
===================================================== */

socket.on(
    "salaUnida",
    datos => {

        console.log(
            "Sala unida:",
            datos
        );


        if (
            !datos ||
            !datos.codigo
        ) {

            mensaje.textContent =
                "Error entrando a la sala.";

            return;
        }


        entrarAlJuego(
            datos.codigo
        );

    }
);


/* =====================================================
   ENTRAR AL JUEGO
===================================================== */

function entrarAlJuego(
    codigo
) {

    salaActual =
        codigo;


    codigoSala.textContent =
        codigo;


    menu.style.display =
        "none";


    juego.style.display =
        "block";


    mensaje.textContent =
        "";

}


/* =====================================================
   ERROR DE SALA
===================================================== */

socket.on(
    "errorSala",
    texto => {

        console.error(
            texto
        );


        mensaje.textContent =
            texto;

    }
);


/* =====================================================
   ACTUALIZAR JUGADORES
===================================================== */

socket.on(
    "actualizarJugadores",
    lista => {

        console.log(
            "Jugadores:",
            lista
        );


        if (
            !Array.isArray(lista)
        ) {

            console.error(
                "El servidor no envió un array:",
                lista
            );

            return;
        }


        jugadores =
            lista;


        cantidadJugadores.textContent =
            jugadores.length;


        const yo =
            jugadores.find(
                jugador =>
                    jugador.id ===
                    miId
            );


        if (yo) {

            /*
             * Sincronización inicial.
             */

            if (
                Math.abs(
                    player.x - yo.x
                ) > 100 ||
                Math.abs(
                    player.y - yo.y
                ) > 100
            ) {

                player.x =
                    yo.x;

                player.y =
                    yo.y;

            }

        }

    }
);


/* =====================================================
   TECLADO
===================================================== */

const keys = {

    up: false,
    down: false,
    left: false,
    right: false

};


document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        if (
            key === "w" ||
            key === "arrowup"
        ) {

            keys.up = true;

        }


        if (
            key === "s" ||
            key === "arrowdown"
        ) {

            keys.down = true;

        }


        if (
            key === "a" ||
            key === "arrowleft"
        ) {

            keys.left = true;

        }


        if (
            key === "d" ||
            key === "arrowright"
        ) {

            keys.right = true;

        }


        actualizarDireccion();

    }
);


document.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();


        if (
            key === "w" ||
            key === "arrowup"
        ) {

            keys.up = false;

        }


        if (
            key === "s" ||
            key === "arrowdown"
        ) {

            keys.down = false;

        }


        if (
            key === "a" ||
            key === "arrowleft"
        ) {

            keys.left = false;

        }


        if (
            key === "d" ||
            key === "arrowright"
        ) {

            keys.right = false;

        }


        actualizarDireccion();

    }
);


/* =====================================================
   DIRECCIÓN
===================================================== */

function actualizarDireccion() {

    let dx = 0;
    let dy = 0;


    if (keys.left)
        dx--;

    if (keys.right)
        dx++;

    if (keys.up)
        dy--;

    if (keys.down)
        dy++;


    /*
     * Evita que la diagonal sea más rápida.
     */

    if (
        dx !== 0 &&
        dy !== 0
    ) {

        const longitud =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        dx /=
            longitud;

        dy /=
            longitud;

    }


    player.dx =
        dx;

    player.dy =
        dy;

}


/* =====================================================
   PARED
===================================================== */

function esPared(
    x,
    y
) {

    const columna =
        Math.floor(
            x / CELL
        );


    const fila =
        Math.floor(
            y / CELL
        );


    if (
        columna < 0 ||
        columna >= COLS ||
        fila < 0 ||
        fila >= ROWS
    ) {

        return true;

    }


    return (
        MAP[fila][columna] === "#"
    );

}


/* =====================================================
   COLISIÓN
===================================================== */

function puedeMoverse(
    x,
    y
) {

    const r =
        player.radius;


    return (

        !esPared(
            x - r,
            y - r
        )

        &&

        !esPared(
            x + r,
            y - r
        )

        &&

        !esPared(
            x - r,
            y + r
        )

        &&

        !esPared(
            x + r,
            y + r
        )

    );

}


/* =====================================================
   MOVIMIENTO
===================================================== */

let ultimoEnvio = 0;


function moverJugador(
    delta
) {

    if (
        juego.style.display ===
        "none"
    ) {

        return;
    }


    const movimientoX =
        player.dx *
        player.speed *
        delta;


    const movimientoY =
        player.dy *
        player.speed *
        delta;


    /*
     * Movimiento horizontal.
     */

    const nuevoX =
        player.x +
        movimientoX;


    if (
        puedeMoverse(
            nuevoX,
            player.y
        )
    ) {

        player.x =
            nuevoX;

    }


    /*
     * Movimiento vertical.
     */

    const nuevoY =
        player.y +
        movimientoY;


    if (
        puedeMoverse(
            player.x,
            nuevoY
        )
    ) {

        player.y =
            nuevoY;

    }


    /*
     * Enviar posición.
     */

    const ahora =
        performance.now();


    if (
        ahora - ultimoEnvio >
        33
    ) {

        ultimoEnvio =
            ahora;


        socket.emit(
            "moverJugador",
            {
                x: player.x,
                y: player.y
            }
        );

    }

}


/* =====================================================
   DIBUJAR MAPA
===================================================== */

function dibujarMapa() {

    for (
        let y = 0;
        y < ROWS;
        y++
    ) {

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            const tile =
                MAP[y][x];


            if (
                tile === "#"
            ) {

                ctx.fillStyle =
                    "#28105f";


                ctx.fillRect(
                    x * CELL,
                    y * CELL,
                    CELL,
                    CELL
                );


                ctx.strokeStyle =
                    "#713cff";


                ctx.lineWidth =
                    2;


                ctx.strokeRect(
                    x * CELL + 1,
                    y * CELL + 1,
                    CELL - 2,
                    CELL - 2
                );

            } else {

                ctx.fillStyle =
                    "#000";


                ctx.fillRect(
                    x * CELL,
                    y * CELL,
                    CELL,
                    CELL
                );

            }

        }

    }

}


/* =====================================================
   DIBUJAR PERSONAJE
===================================================== */

function dibujarJugador(
    x,
    y,
    color,
    nombre
) {

    /*
     * Aura.
     */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        14,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color === "#ffff00"
            ? "rgba(255,255,0,0.15)"
            : "rgba(255,0,0,0.15)";


    ctx.fill();


    /*
     * Cuerpo.
     */

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        8,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        color;


    ctx.fill();


    /*
     * Borde.
     */

    ctx.strokeStyle =
        "#fff";


    ctx.lineWidth =
        2;


    ctx.stroke();


    /*
     * Brillo.
     */

    ctx.beginPath();

    ctx.arc(
        x - 2,
        y - 2,
        2,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#fff";


    ctx.fill();


    /*
     * Nombre.
     */

    ctx.font =
        "bold 11px Arial";


    ctx.textAlign =
        "center";


    ctx.fillStyle =
        "#fff";


    ctx.fillText(
        nombre,
        x,
        y - 15
    );

}


/* =====================================================
   DIBUJAR JUGADORES
===================================================== */

function dibujarJugadores() {

    if (
        !Array.isArray(jugadores)
    ) {

        return;
    }


    jugadores.forEach(
        (jugador, indice) => {

            if (!jugador)
                return;


            if (
                jugador.id === miId
            )
                return;


            if (
                typeof jugador.x !==
                    "number" ||

                typeof jugador.y !==
                    "number"
            )
                return;


            dibujarJugador(
                jugador.x,
                jugador.y,
                "#ff3333",
                "JUGADOR " +
                (indice + 1)
            );

        }
    );


    /*
     * Nuestro jugador.
     */

    dibujarJugador(
        player.x,
        player.y,
        "#ffff00",
        "YO"
    );

}


/* =====================================================
   DIBUJAR
===================================================== */

function dibujar() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    dibujarMapa();

    dibujarJugadores();

}


/* =====================================================
   GAME LOOP
===================================================== */

let ultimoTiempo =
    performance.now();


function gameLoop(
    tiempo
) {

    let delta =
        (tiempo -
            ultimoTiempo) /
        1000;


    ultimoTiempo =
        tiempo;


    if (
        delta > 0.05
    ) {

        delta = 0.05;

    }


    moverJugador(
        delta
    );


    dibujar();


    requestAnimationFrame(
        gameLoop
    );

}


requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
