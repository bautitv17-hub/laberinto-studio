<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laberinto Online</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           MENU
        ===================================================== */

        #menu {
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 15px;

            background: #080808;
        }

        #menu h1 {
            margin: 0 0 20px 0;

            font-size: 40px;
            text-align: center;
        }


        button,
        input {
            width: 280px;

            padding: 14px;

            border: none;
            border-radius: 8px;

            font-size: 17px;
        }


        button {
            background: #6c2cff;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }


        button:hover {
            background: #814cff;
        }


        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        input {
            text-align: center;

            text-transform: uppercase;

            outline: none;
        }


        input:focus {
            box-shadow: 0 0 0 2px #6c2cff;
        }


        #mensaje {
            min-height: 25px;

            color: #ff5555;

            text-align: center;

            max-width: 400px;
        }


        /* =====================================================
           JUEGO
        ===================================================== */

        #juego {
            display: none;

            width: 100vw;
            height: 100vh;

            position: relative;

            justify-content: center;
            align-items: center;

            background: #050505;
        }


        /* =====================================================
           INFORMACIÓN
        ===================================================== */

        #informacion {
            position: absolute;

            top: 10px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 20;

            text-align: center;

            background: rgba(0, 0, 0, 0.85);

            padding: 8px 20px;

            border-radius: 10px;

            pointer-events: none;
        }


        #informacion h2 {
            margin: 0 0 5px 0;

            font-size: 20px;
        }


        #informacion div {
            font-size: 15px;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        canvas {
            display: block;

            background: #000;

            border: 2px solid #713cff;

            max-width: 100vw;
            max-height: 100vh;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         MENU
    ===================================================== -->

    <div id="menu">

        <h1>
            LABERINTO ONLINE
        </h1>


        <button id="crearSala">
            CREAR SALA
        </button>


        <input
            id="codigoInput"
            type="text"
            maxlength="5"
            placeholder="CÓDIGO DE SALA"
            autocomplete="off"
            spellcheck="false"
        >


        <button id="unirseSala">
            UNIRSE A LA SALA
        </button>


        <div id="mensaje"></div>

    </div>



    <!-- =====================================================
         JUEGO
    ===================================================== -->

    <div id="juego">


        <div id="informacion">

            <h2>

                SALA:
                <span id="codigoSala">-----</span>

            </h2>


            <div>

                Jugadores:

                <span id="cantidadJugadores">
                    0
                </span>

                /4

            </div>

        </div>


        <canvas id="cancha"></canvas>

    </div>



    <!-- =====================================================
         SOCKET.IO
    ===================================================== -->

    <script src="/socket.io/socket.io.js"></script>


    <script>

        "use strict";


        // =====================================================
        // SOCKET
        // =====================================================

        const socket = io({
            transports: ["websocket", "polling"]
        });


        // =====================================================
        // ELEMENTOS
        // =====================================================

        const menu =
            document.getElementById("menu");

        const juego =
            document.getElementById("juego");

        const crearSalaBtn =
            document.getElementById("crearSala");

        const unirseSalaBtn =
            document.getElementById("unirseSala");

        const codigoInput =
            document.getElementById("codigoInput");

        const mensaje =
            document.getElementById("mensaje");

        const codigoSala =
            document.getElementById("codigoSala");

        const cantidadJugadores =
            document.getElementById("cantidadJugadores");

        const canvas =
            document.getElementById("cancha");

        const ctx =
            canvas.getContext("2d");


        // =====================================================
        // MAPA
        // =====================================================

        const CELL = 20;


        const MAP = [

            "#######################################",
            "#P        #       #       #          #",
            "#         #       #       #          #",
            "#         #       #       #          #",
            "#         ###     #     ###      ######",
            "#                                   ##",
            "#                                   ##",
            "###   #########       #########    ##",
            "#     #                         #    #",
            "#     #       ###########       #    #",
            "#     #       #         #       #    #",
            "#             #         #            #",
            "#             #         #            #",
            "#     #       #         #       #    #",
            "#     #       ###########       #    #",
            "#     #                         #    #",
            "###   #########       #########    ##",
            "#                                   ##",
            "#                                   ##",
            "#         ###     #     ###         ##",
            "#         #       #       #         ##",
            "#         #       #       #         ##",
            "#         #       #       #         ##",
            "#         #       #       #         ##",
            "#                                   ##",
            "#      ######           ######      ##",
            "#      #                     #      ##",
            "#      #                     #      ##",
            "#                                   ##",
            "#                                   ##",
            "#######################################"

        ];


        const ROWS = MAP.length;

        const COLS = MAP[0].length;


        canvas.width =
            COLS * CELL;

        canvas.height =
            ROWS * CELL;



        // =====================================================
        // ESTADO
        // =====================================================

        let miId = null;

        let salaActual = null;

        let jugadores = [];

        let conectado = false;


        let jugadorLocal = {
            x: 30,
            y: 30
        };


        // =====================================================
        // MOVIMIENTO VISUAL DE JUGADORES REMOTOS
        // =====================================================

        /*
            Cada jugador remoto tiene:

            x / y
                posición real recibida del servidor

            renderX / renderY
                posición que se muestra en pantalla

            De esta manera los jugadores no saltan
            directamente de una posición a otra.
        */

        const posicionesVisuales = new Map();


        // =====================================================
        // TECLAS
        // =====================================================

        const teclas = {};


        // =====================================================
        // CONEXIÓN
        // =====================================================

        socket.on("connect", () => {

            miId = socket.id;

            conectado = true;

            console.log(
                "Conectado al servidor:",
                miId
            );

        });


        socket.on("connect_error", (error) => {

            conectado = false;

            console.error(
                "Error de conexión:",
                error
            );


            mensaje.textContent =
                "No se pudo conectar al servidor.";

        });


        socket.on("disconnect", (motivo) => {

            conectado = false;

            console.log(
                "Desconectado:",
                motivo
            );


            if (salaActual) {

                mensaje.textContent =
                    "Se perdió la conexión con el servidor.";

            }

        });



        // =====================================================
        // CREAR SALA
        // =====================================================

        crearSalaBtn.addEventListener(
            "click",
            () => {

                if (!conectado) {

                    mensaje.textContent =
                        "Esperá a que el servidor conecte.";

                    return;

                }


                mensaje.textContent =
                    "Creando sala...";


                crearSalaBtn.disabled =
                    true;


                socket.emit(
                    "crearSala"
                );


                setTimeout(() => {

                    crearSalaBtn.disabled =
                        false;

                }, 2000);

            }
        );



        // =====================================================
        // UNIRSE A SALA
        // =====================================================

        unirseSalaBtn.addEventListener(
            "click",
            intentarUnirse
        );


        codigoInput.addEventListener(
            "input",
            () => {

                codigoInput.value =
                    codigoInput.value
                        .toUpperCase()
                        .replace(/[^A-Z0-9]/g, "")
                        .slice(0, 5);

            }
        );


        codigoInput.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    intentarUnirse();

                }

            }
        );


        function intentarUnirse() {

            if (!conectado) {

                mensaje.textContent =
                    "Esperá a que el servidor conecte.";

                return;

            }


            const codigo =
                codigoInput.value
                    .trim()
                    .toUpperCase();


            if (codigo.length !== 5) {

                mensaje.textContent =
                    "El código debe tener 5 caracteres.";

                return;

            }


            mensaje.textContent =
                "Entrando a la sala...";


            unirseSalaBtn.disabled =
                true;


            socket.emit(
                "unirseSala",
                codigo
            );


            setTimeout(() => {

                unirseSalaBtn.disabled =
                    false;

            }, 2000);

        }



        // =====================================================
        // SALA CREADA
        // =====================================================

        socket.on(
            "salaCreada",
            (datos) => {

                console.log(
                    "salaCreada:",
                    datos
                );


                if (
                    !datos ||
                    typeof datos.codigo !== "string"
                ) {

                    mensaje.textContent =
                        "Respuesta inválida del servidor.";

                    return;

                }


                entrarAlJuego(
                    datos.codigo
                );

            }
        );



        // =====================================================
        // SALA UNIDA
        // =====================================================

        socket.on(
            "salaUnida",
            (datos) => {

                console.log(
                    "salaUnida:",
                    datos
                );


                if (
                    !datos ||
                    typeof datos.codigo !== "string"
                ) {

                    mensaje.textContent =
                        "Respuesta inválida del servidor.";

                    return;

                }


                entrarAlJuego(
                    datos.codigo
                );

            }
        );



        // =====================================================
        // ERROR DE SALA
        // =====================================================

        socket.on(
            "errorSala",
            (texto) => {

                console.error(
                    "Error de sala:",
                    texto
                );


                mensaje.textContent =
                    texto ||
                    "No se pudo entrar a la sala.";


                unirseSalaBtn.disabled =
                    false;

                crearSalaBtn.disabled =
                    false;

            }
        );



        // =====================================================
        // ENTRAR AL JUEGO
        // =====================================================

        function entrarAlJuego(codigo) {

            salaActual =
                codigo;


            codigoSala.textContent =
                codigo;


            mensaje.textContent =
                "";


            menu.style.display =
                "none";


            juego.style.display =
                "flex";


            console.log(
                "Entraste a la sala:",
                codigo
            );

        }



        // =====================================================
        // ACTUALIZAR JUGADORES
        // =====================================================

        socket.on(
            "actualizarJugadores",
            (lista) => {

                if (!Array.isArray(lista)) {

                    console.error(
                        "El servidor no envió un array:",
                        lista
                    );

                    return;

                }


                const nuevosJugadores =
                    lista
                        .filter(
                            (jugador) => {

                                return (

                                    jugador &&
                                    typeof jugador.id === "string" &&
                                    Number.isFinite(
                                        Number(jugador.x)
                                    ) &&
                                    Number.isFinite(
                                        Number(jugador.y)
                                    )

                                );

                            }
                        )
                        .map(
                            (jugador) => {

                                return {

                                    id:
                                        jugador.id,

                                    x:
                                        Number(jugador.x),

                                    y:
                                        Number(jugador.y)

                                };

                            }
                        );


                jugadores =
                    nuevosJugadores;


                cantidadJugadores.textContent =
                    jugadores.length;



                // =================================================
                // PREPARAR INTERPOLACIÓN
                // =================================================

                const idsActuales =
                    new Set();


                jugadores.forEach(
                    (jugador) => {

                        idsActuales.add(
                            jugador.id
                        );


                        // El jugador local se maneja
                        // directamente con jugadorLocal.

                        if (
                            jugador.id === miId
                        ) {

                            if (
                                !estaMoviendose()
                            ) {

                                /*
                                    Cuando dejamos de movernos,
                                    hacemos una pequeña corrección
                                    hacia la posición del servidor
                                    en vez de pegar un salto.
                                */

                                jugadorLocal.x +=
                                    (
                                        jugador.x -
                                        jugadorLocal.x
                                    ) * 0.25;


                                jugadorLocal.y +=
                                    (
                                        jugador.y -
                                        jugadorLocal.y
                                    ) * 0.25;

                            }

                            return;

                        }



                        // Jugadores remotos

                        const visual =
                            posicionesVisuales.get(
                                jugador.id
                            );


                        if (!visual) {

                            posicionesVisuales.set(
                                jugador.id,
                                {

                                    x:
                                        jugador.x,

                                    y:
                                        jugador.y,

                                    objetivoX:
                                        jugador.x,

                                    objetivoY:
                                        jugador.y

                                }
                            );

                        }

                        else {

                            visual.objetivoX =
                                jugador.x;

                            visual.objetivoY =
                                jugador.y;

                        }

                    }
                );



                // Eliminar jugadores que ya no están

                for (
                    const id of posicionesVisuales.keys()
                ) {

                    if (
                        !idsActuales.has(id)
                    ) {

                        posicionesVisuales.delete(
                            id
                        );

                    }

                }

            }
        );



        // =====================================================
        // SABER SI SE ESTÁ MOVIENDO
        // =====================================================

        function estaMoviendose() {

            return (

                teclas["w"] ||
                teclas["a"] ||
                teclas["s"] ||
                teclas["d"] ||
                teclas["arrowup"] ||
                teclas["arrowdown"] ||
                teclas["arrowleft"] ||
                teclas["arrowright"]

            );

        }



        // =====================================================
        // PARED
        // =====================================================

        function esPared(x, y) {

            const col =
                Math.floor(
                    x / CELL
                );


            const row =
                Math.floor(
                    y / CELL
                );


            if (
                row < 0 ||
                row >= ROWS ||
                col < 0 ||
                col >= COLS
            ) {

                return true;

            }


            return MAP[row][col] === "#";

        }



        // =====================================================
        // COLISIÓN
        // =====================================================

        function puedeMoverse(x, y) {

            const radio = 8;


            return (

                !esPared(
                    x - radio,
                    y - radio
                ) &&

                !esPared(
                    x + radio,
                    y - radio
                ) &&

                !esPared(
                    x - radio,
                    y + radio
                ) &&

                !esPared(
                    x + radio,
                    y + radio
                )

            );

        }



        // =====================================================
        // TECLADO
        // =====================================================

        window.addEventListener(
            "keydown",
            (event) => {

                const tecla =
                    event.key.toLowerCase();


                teclas[tecla] =
                    true;


                if (
                    [
                        "w",
                        "a",
                        "s",
                        "d",
                        "arrowup",
                        "arrowdown",
                        "arrowleft",
                        "arrowright"
                    ].includes(tecla)
                ) {

                    event.preventDefault();

                }

            }
        );


        window.addEventListener(
            "keyup",
            (event) => {

                const tecla =
                    event.key.toLowerCase();


                teclas[tecla] =
                    false;

            }
        );


        window.addEventListener(
            "blur",
            () => {

                for (
                    const tecla in teclas
                ) {

                    teclas[tecla] =
                        false;

                }

            }
        );



        // =====================================================
        // MOVIMIENTO
        // =====================================================

        let ultimoEnvio =
            0;


        function actualizarMovimiento(dt) {

            if (
                !salaActual ||
                !conectado
            ) {

                return;

            }


            let dx = 0;

            let dy = 0;


            if (
                teclas["w"] ||
                teclas["arrowup"]
            ) {

                dy -= 1;

            }


            if (
                teclas["s"] ||
                teclas["arrowdown"]
            ) {

                dy += 1;

            }


            if (
                teclas["a"] ||
                teclas["arrowleft"]
            ) {

                dx -= 1;

            }


            if (
                teclas["d"] ||
                teclas["arrowright"]
            ) {

                dx += 1;

            }


            if (
                dx === 0 &&
                dy === 0
            ) {

                return;

            }


            // =================================================
            // NORMALIZAR DIAGONAL
            // =================================================

            const longitud =
                Math.hypot(
                    dx,
                    dy
                );


            dx /=
                longitud;


            dy /=
                longitud;



            // =================================================
            // VELOCIDAD
            // =================================================

            const velocidad =
                220;


            const movimiento =
                velocidad * dt;



            // =================================================
            // NUEVA POSICIÓN
            // =================================================

            let nuevoX =
                jugadorLocal.x +
                dx * movimiento;


            let nuevoY =
                jugadorLocal.y +
                dy * movimiento;



            // =================================================
            // COLISIÓN HORIZONTAL
            // =================================================

            if (
                puedeMoverse(
                    nuevoX,
                    jugadorLocal.y
                )
            ) {

                jugadorLocal.x =
                    nuevoX;

            }



            // =================================================
            // COLISIÓN VERTICAL
            // =================================================

            if (
                puedeMoverse(
                    jugadorLocal.x,
                    nuevoY
                )
            ) {

                jugadorLocal.y =
                    nuevoY;

            }



            // =================================================
            // ENVIAR AL SERVIDOR
            //
            // En vez de mandar demasiado seguido,
            // mandamos aproximadamente 30 veces por segundo.
            // =================================================

            const ahora =
                performance.now();


            if (
                ahora -
                ultimoEnvio >=
                33
            ) {

                ultimoEnvio =
                    ahora;


                socket.emit(
                    "moverJugador",
                    {

                        x:
                            jugadorLocal.x,

                        y:
                            jugadorLocal.y

                    }
                );

            }

        }



        // =====================================================
        // ACTUALIZAR MOVIMIENTO VISUAL REMOTO
        // =====================================================

        function actualizarJugadoresVisuales(dt) {

            /*
                La interpolación usa una curva suave.

                Esto evita que un jugador remoto
                aparezca saltando entre posiciones.
            */

            const suavizado =
                1 -
                Math.exp(
                    -18 * dt
                );


            posicionesVisuales.forEach(
                (visual) => {

                    visual.x +=
                        (
                            visual.objetivoX -
                            visual.x
                        ) *
                        suavizado;


                    visual.y +=
                        (
                            visual.objetivoY -
                            visual.y
                        ) *
                        suavizado;

                }
            );

        }



        // =====================================================
        // DIBUJAR MAPA
        // =====================================================

        function dibujarMapa() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            for (
                let fila = 0;
                fila < ROWS;
                fila++
            ) {

                for (
                    let columna = 0;
                    columna < COLS;
                    columna++
                ) {

                    const x =
                        columna *
                        CELL;


                    const y =
                        fila *
                        CELL;


                    if (
                        MAP[fila][columna] === "#"
                    ) {

                        ctx.fillStyle =
                            "#28105f";


                        ctx.fillRect(
                            x,
                            y,
                            CELL,
                            CELL
                        );


                        ctx.strokeStyle =
                            "#713cff";


                        ctx.lineWidth =
                            1;


                        ctx.strokeRect(
                            x,
                            y,
                            CELL,
                            CELL
                        );

                    }

                    else {

                        ctx.fillStyle =
                            "#050505";


                        ctx.fillRect(
                            x,
                            y,
                            CELL,
                            CELL
                        );

                    }

                }

            }

        }



        // =====================================================
        // DIBUJAR JUGADORES
        // =====================================================

        function dibujarJugadores() {

            if (
                !Array.isArray(jugadores)
            ) {

                return;

            }


            jugadores.forEach(
                (jugador, indice) => {

                    let x;
                    let y;


                    // =================================================
                    // JUGADOR LOCAL
                    // =================================================

                    if (
                        jugador.id === miId
                    ) {

                        x =
                            jugadorLocal.x;

                        y =
                            jugadorLocal.y;

                    }

                    // =================================================
                    // JUGADOR REMOTO
                    // =================================================

                    else {

                        const visual =
                            posicionesVisuales.get(
                                jugador.id
                            );


                        if (!visual) {

                            x =
                                jugador.x;

                            y =
                                jugador.y;

                        }

                        else {

                            x =
                                visual.x;

                            y =
                                visual.y;

                        }

                    }


                    if (
                        !Number.isFinite(x) ||
                        !Number.isFinite(y)
                    ) {

                        return;

                    }



                    // =================================================
                    // COLOR
                    // =================================================

                    if (
                        jugador.id === miId
                    ) {

                        ctx.fillStyle =
                            "#ffe600";

                    }

                    else {

                        const colores = [

                            "#ff3030",
                            "#00eaff",
                            "#ff7b00",
                            "#00ff66"

                        ];


                        ctx.fillStyle =
                            colores[
                                indice %
                                colores.length
                            ];

                    }



                    // =================================================
                    // JUGADOR
                    // =================================================

                    ctx.beginPath();


                    ctx.arc(
                        x,
                        y,
                        8,
                        0,
                        Math.PI * 2
                    );


                    ctx.fill();



                    // =================================================
                    // BORDE
                    // =================================================

                    ctx.strokeStyle =
                        "#ffffff";


                    ctx.lineWidth =
                        2;


                    ctx.stroke();

                }
            );

        }



        // =====================================================
        // GAME LOOP
        // =====================================================

        let ultimoTiempo =
            performance.now();


        function gameLoop(tiempo) {

            const dt =
                Math.min(
                    (
                        tiempo -
                        ultimoTiempo
                    ) / 1000,

                    0.05
                );


            ultimoTiempo =
                tiempo;


            actualizarMovimiento(
                dt
            );


            actualizarJugadoresVisuales(
                dt
            );


            dibujarMapa();


            dibujarJugadores();


            requestAnimationFrame(
                gameLoop
            );

        }


        requestAnimationFrame(
            gameLoop
        );

    </script>

</body>
</html>
