<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Laberinto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* =========================
           MENÚ
        ========================= */

        #menu {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #24133d 0%, #09070d 55%, #000 100%);
            z-index: 10;
        }

        #menu h1 {
            margin: 0 0 35px;
            font-size: 55px;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px #8b4dff;
        }

        .boton {
            width: 280px;
            padding: 16px;
            margin: 8px;
            border: 2px solid #8b4dff;
            border-radius: 8px;
            background: #120c1c;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton:hover {
            background: #8b4dff;
            box-shadow: 0 0 20px #8b4dff;
            transform: scale(1.04);
        }

        #codigoInput {
            width: 280px;
            padding: 15px;
            margin: 8px;
            border: 2px solid #8b4dff;
            border-radius: 8px;
            outline: none;
            background: #0b080f;
            color: white;
            font-size: 20px;
            text-align: center;
            text-transform: uppercase;
        }

        #mensaje {
            min-height: 25px;
            margin-top: 15px;
            color: #ff6464;
            font-weight: bold;
            text-align: center;
        }

        #salaCreada {
            margin-top: 15px;
            font-size: 20px;
        }

        #codigoSala {
            color: #b77cff;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        /* =========================
           BOTÓN DE MÚSICA
        ========================= */

        #botonMusica {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 55px;
            height: 55px;
            border: 2px solid #8b4dff;
            border-radius: 50%;
            background: rgba(10, 5, 20, 0.9);
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 15px rgba(139, 77, 255, 0.5);
        }

        #botonMusica:hover {
            background: #8b4dff;
            transform: scale(1.08);
        }

        /* =========================
           JUEGO
        ========================= */

        #juego {
            display: none;
            position: fixed;
            inset: 0;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #gameCanvas {
            width: 780px;
            height: 620px;
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: pixelated;
            border: 2px solid #8b4dff;
            box-shadow: 0 0 30px rgba(139, 77, 255, 0.4);
        }

        #infoSala {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            z-index: 5;
        }
    </style>
</head>

<body>

    <!-- =========================
         MÚSICA
    ========================= -->

    <audio
        id="musicaMenu"
        src="musica.mp3"
        loop
        preload="auto">
    </audio>


    <!-- =========================
         MENÚ
    ========================= -->

    <div id="menu">

        <h1>EL LABERINTO</h1>

        <button class="boton" id="crearSalaBtn">
            CREAR SALA
        </button>

        <input
            type="text"
            id="codigoInput"
            maxlength="5"
            placeholder="CÓDIGO DE SALA">

        <button class="boton" id="unirseSalaBtn">
            UNIRSE A SALA
        </button>

        <div id="salaCreada">
            Código de sala:
            <span id="codigoSala">-----</span>
        </div>

        <div id="mensaje"></div>

    </div>


    <!-- BOTÓN DE MÚSICA -->
    <button id="botonMusica" title="Activar/desactivar música">
        🔊
    </button>


    <!-- =========================
         JUEGO
    ========================= -->

    <div id="juego">

        <div id="infoSala">
            Sala:
            <strong id="codigoSalaJuego">-----</strong>
        </div>

        <canvas
            id="gameCanvas"
            width="780"
            height="620">
        </canvas>

    </div>


    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <script>

        /* =====================================
           ELEMENTOS
        ===================================== */

        const menu = document.getElementById("menu");
        const juego = document.getElementById("juego");

        const crearSalaBtn = document.getElementById("crearSalaBtn");
        const unirseSalaBtn = document.getElementById("unirseSalaBtn");

        const codigoInput = document.getElementById("codigoInput");
        const codigoSala = document.getElementById("codigoSala");
        const codigoSalaJuego = document.getElementById("codigoSalaJuego");

        const mensaje = document.getElementById("mensaje");

        const musicaMenu = document.getElementById("musicaMenu");
        const botonMusica = document.getElementById("botonMusica");


        /* =====================================
           MÚSICA
        ===================================== */

        let musicaActiva = true;

        musicaMenu.volume = 0.28;


        function iniciarMusica() {

            if (!musicaActiva) {
                return;
            }

            musicaMenu.volume = 0.28;

            musicaMenu.play()
                .then(() => {

                    botonMusica.textContent = "🔊";

                })
                .catch(error => {

                    console.log(
                        "El navegador bloqueó la reproducción:",
                        error
                    );

                });
        }


        function detenerMusica() {

            musicaMenu.pause();
            musicaMenu.currentTime = 0;

        }


        botonMusica.addEventListener("click", function(event) {

            event.stopPropagation();

            if (musicaMenu.paused) {

                musicaActiva = true;

                musicaMenu.volume = 0.28;

                musicaMenu.play()
                    .then(() => {

                        botonMusica.textContent = "🔊";

                    })
                    .catch(() => {

                        botonMusica.textContent = "🔇";

                    });

            } else {

                musicaActiva = false;

                musicaMenu.pause();

                botonMusica.textContent = "🔇";

            }

        });


        /* =====================================
           SOCKET.IO
        ===================================== */

        const socket = io();

        let conectado = false;
        let salaActual = null;


        socket.on("connect", () => {

            conectado = true;

            console.log(
                "Conectado al servidor:",
                socket.id
            );

        });


        socket.on("disconnect", () => {

            conectado = false;

            console.log("Desconectado del servidor");

        });


        /* =====================================
           CREAR SALA
        ===================================== */

        crearSalaBtn.addEventListener("click", () => {

            iniciarMusica();

            mensaje.textContent = "";

            if (!conectado) {

                mensaje.textContent =
                    "Esperando conexión con el servidor...";

                return;

            }

            socket.emit("crearSala");

        });


        /* =====================================
           SALA CREADA
        ===================================== */

        socket.on("salaCreada", datos => {

            if (!datos || !datos.codigo) {
                return;
            }

            entrarAlJuego(datos.codigo);

        });


        /* =====================================
           UNIRSE A SALA
        ===================================== */

        function intentarUnirse() {

            iniciarMusica();

            mensaje.textContent = "";

            const codigo =
                codigoInput.value.trim().toUpperCase();


            if (codigo.length !== 5) {

                mensaje.textContent =
                    "El código debe tener 5 caracteres.";

                return;

            }


            if (!conectado) {

                mensaje.textContent =
                    "Esperando conexión con el servidor...";

                return;

            }


            socket.emit("unirseSala", codigo);

        }


        unirseSalaBtn.addEventListener(
            "click",
            intentarUnirse
        );


        codigoInput.addEventListener("keydown", event => {

            if (event.key === "Enter") {

                intentarUnirse();

            }

        });


        /* =====================================
           SALA UNIDA
        ===================================== */

        socket.on("salaUnida", datos => {

            if (!datos || !datos.codigo) {
                return;
            }

            entrarAlJuego(datos.codigo);

        });


        /* =====================================
           ERROR DE SALA
        ===================================== */

        socket.on("errorSala", texto => {

            mensaje.textContent = texto;

        });


        /* =====================================
           ENTRAR AL JUEGO
        ===================================== */

        function entrarAlJuego(codigo) {

            salaActual = codigo;

            codigoSala.textContent = codigo;
            codigoSalaJuego.textContent = codigo;

            mensaje.textContent = "";

            /*
             * APAGAMOS LA MÚSICA AL ENTRAR
             * AL JUEGO
             */
            detenerMusica();

            botonMusica.style.display = "none";

            menu.style.display = "none";
            juego.style.display = "flex";

            console.log(
                "Entraste a la sala:",
                codigo
            );

            iniciarJuego();

        }


        /* =====================================
           JUEGO
        ===================================== */

        const canvas =
            document.getElementById("gameCanvas");

        const ctx = canvas.getContext("2d");


        const MAP = [
            "#######################################",
            "#P        #       #       #          #",
            "#         #       #       #          #",
            "#         #       #       #          #",
            "#         ###     #     ###      ######",
            "#                                   ##",
            "#                                   ##",
            "###   #########       #########    ##",
            "#     #                         #    #",
            "#     #       ###########       #    #",
            "#     #       #         #       #    #",
            "#             #         #            #",
            "#             #         #            #",
            "#     #       #         #       #    #",
            "#     #       ###########       #    #",
            "#     #                         #    #",
            "###   #########       #########    ##",
            "#                                   ##",
            "#                                   ##",
            "#         ###     #     ###         ##",
            "#         #       #       #         ##",
            "#         #       #       #         ##",
            "#         #       #         #         ##",
            "#         #       #       #         ##",
            "#                                   ##",
            "#      ######           ######      ##",
            "#      #                     #      ##",
            "#      #                     #      ##",
            "#                                   ##",
            "#                                   ##",
            "#######################################"
        ];


        const CELL = 20;

        const ROWS = MAP.length;
        const COLS = MAP[0].length;


        const SPEED = 220;
        const PLAYER_RADIUS = 8;


        let jugadores = [];

        let jugadorLocal = null;

        let posicionesVisuales = new Map();

        let teclas = {};


        /* =====================================
           TECLADO
        ===================================== */

        window.addEventListener("keydown", event => {

            teclas[event.key.toLowerCase()] = true;

        });


        window.addEventListener("keyup", event => {

            teclas[event.key.toLowerCase()] = false;

        });


        /* =====================================
           RECIBIR JUGADORES
        ===================================== */

        socket.on("actualizarJugadores", lista => {

            if (!Array.isArray(lista)) {

                console.error(
                    "actualizarJugadores no recibió un array:",
                    lista
                );

                return;

            }


            jugadores = lista;


            jugadorLocal =
                jugadores.find(
                    jugador =>
                        jugador.id === socket.id
                );


            jugadores.forEach(jugador => {

                if (!posicionesVisuales.has(jugador.id)) {

                    posicionesVisuales.set(
                        jugador.id,
                        {
                            x: jugador.x,
                            y: jugador.y,
                            objetivoX: jugador.x,
                            objetivoY: jugador.y
                        }
                    );

                } else {

                    const visual =
                        posicionesVisuales.get(jugador.id);

                    visual.objetivoX = jugador.x;
                    visual.objetivoY = jugador.y;

                }

            });


            for (const id of posicionesVisuales.keys()) {

                if (
                    !jugadores.some(
                        jugador => jugador.id === id
                    )
                ) {

                    posicionesVisuales.delete(id);

                }

            }

        });


        /* =====================================
           COLISIÓN
        ===================================== */

        function esPared(x, y) {

            const columna =
                Math.floor(x / CELL);

            const fila =
                Math.floor(y / CELL);


            if (
                fila < 0 ||
                fila >= ROWS ||
                columna < 0 ||
                columna >= COLS
            ) {

                return true;

            }


            return MAP[fila][columna] === "#";

        }


        function puedeMoverse(x, y) {

            const puntos = [

                [x - PLAYER_RADIUS, y - PLAYER_RADIUS],
                [x + PLAYER_RADIUS, y - PLAYER_RADIUS],
                [x - PLAYER_RADIUS, y + PLAYER_RADIUS],
                [x + PLAYER_RADIUS, y + PLAYER_RADIUS]

            ];


            return puntos.every(
                ([px, py]) =>
                    !esPared(px, py)
            );

        }


        /* =====================================
           MOVIMIENTO
        ===================================== */

        function actualizarMovimiento(dt) {

            if (!jugadorLocal) {
                return;
            }


            let dx = 0;
            let dy = 0;


            if (
                teclas["w"] ||
                teclas["arrowup"]
            ) {

                dy -= 1;

            }


            if (
                teclas["s"] ||
                teclas["arrowdown"]
            ) {

                dy += 1;

            }


            if (
                teclas["a"] ||
                teclas["arrowleft"]
            ) {

                dx -= 1;

            }


            if (
                teclas["d"] ||
                teclas["arrowright"]
            ) {

                dx += 1;

            }


            if (dx === 0 && dy === 0) {
                return;
            }


            const longitud =
                Math.sqrt(dx * dx + dy * dy);


            dx /= longitud;
            dy /= longitud;


            const movimiento =
                SPEED * dt;


            const nuevoX =
                jugadorLocal.x + dx * movimiento;

            const nuevoY =
                jugadorLocal.y + dy * movimiento;


            if (
                puedeMoverse(
                    nuevoX,
                    jugadorLocal.y
                )
            ) {

                jugadorLocal.x = nuevoX;

            }


            if (
                puedeMoverse(
                    jugadorLocal.x,
                    nuevoY
                )
            ) {

                jugadorLocal.y = nuevoY;

            }


            socket.emit(
                "moverJugador",
                {
                    x: jugadorLocal.x,
                    y: jugadorLocal.y
                }
            );

        }


        /* =====================================
           DIBUJAR MAPA
        ===================================== */

        function dibujarMapa() {

            ctx.fillStyle = "#050505";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            for (
                let fila = 0;
                fila < ROWS;
                fila++
            ) {

                for (
                    let columna = 0;
                    columna < COLS;
                    columna++
                ) {

                    if (
                        MAP[fila][columna] === "#"
                    ) {

                        ctx.fillStyle = "#4d267a";

                        ctx.fillRect(
                            columna * CELL,
                            fila * CELL,
                            CELL,
                            CELL
                        );

                        ctx.strokeStyle =
                            "#7139ad";

                        ctx.strokeRect(
                            columna * CELL,
                            fila * CELL,
                            CELL,
                            CELL
                        );

                    }

                }

            }

        }


        /* =====================================
           DIBUJAR JUGADORES
        ===================================== */

        function dibujarJugadores() {

            const colores = [
                "#ffd900",
                "#ff3b3b",
                "#00eaff",
                "#53ff53"
            ];


            jugadores.forEach(
                (jugador, indice) => {

                    const visual =
                        posicionesVisuales.get(
                            jugador.id
                        );

                    if (!visual) {
                        return;
                    }


                    ctx.beginPath();

                    ctx.arc(
                        visual.x,
                        visual.y,
                        PLAYER_RADIUS,
                        0,
                        Math.PI * 2
                    );


                    if (jugador.id === socket.id) {

                        ctx.fillStyle = "#ffd900";

                    } else {

                        ctx.fillStyle =
                            colores[
                                indice % colores.length
                            ];

                    }


                    ctx.fill();

                    ctx.closePath();


                    ctx.beginPath();

                    ctx.arc(
                        visual.x,
                        visual.y,
                        PLAYER_RADIUS + 3,
                        0,
                        Math.PI * 2
                    );

                    ctx.strokeStyle =
                        jugador.id === socket.id
                            ? "#fff3a0"
                            : "#ffffff55";

                    ctx.stroke();

                    ctx.closePath();

                }
            );

        }


        /* =====================================
           GAME LOOP
        ===================================== */

        let ultimoTiempo = performance.now();


        function gameLoop(ahora) {

            const dt =
                Math.min(
                    (ahora - ultimoTiempo) / 1000,
                    0.05
                );


            ultimoTiempo = ahora;


            actualizarMovimiento(dt);


            const suavizado =
                1 - Math.exp(-18 * dt);


            posicionesVisuales.forEach(
                visual => {

                    visual.x +=
                        (
                            visual.objetivoX -
                            visual.x
                        ) * suavizado;


                    visual.y +=
                        (
                            visual.objetivoY -
                            visual.y
                        ) * suavizado;

                }
            );


            dibujarMapa();
            dibujarJugadores();


            requestAnimationFrame(gameLoop);

        }


        /* =====================================
           INICIAR JUEGO
        ===================================== */

        function iniciarJuego() {

            posicionesVisuales.clear();

            jugadores = [];

            jugadorLocal = null;

            ultimoTiempo = performance.now();

            requestAnimationFrame(gameLoop);

        }

    </script>

</body>
</html>
