<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laberinto Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #menu {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: #080808;
        }

        #menu h1 {
            margin-bottom: 20px;
            font-size: 40px;
        }

        button,
        input {
            width: 280px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 17px;
        }

        button {
            background: #6c2cff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #814cff;
        }

        input {
            text-align: center;
            text-transform: uppercase;
        }

        #mensaje {
            min-height: 25px;
            color: #ff5555;
            text-align: center;
        }

        #juego {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            justify-content: center;
            align-items: center;
            background: #050505;
        }

        #informacion {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 20px;
            border-radius: 10px;
        }

        #informacion h2 {
            margin: 0 0 5px;
            font-size: 20px;
        }

        #informacion div {
            font-size: 15px;
        }

        canvas {
            display: block;
            background: #000;
            border: 2px solid #713cff;
        }
    </style>
</head>

<body>

    <!-- MENÚ -->
    <div id="menu">

        <h1>LABERINTO ONLINE</h1>

        <button id="crearSala">
            CREAR SALA
        </button>

        <input
            id="codigoInput"
            type="text"
            maxlength="5"
            placeholder="CÓDIGO DE SALA"
            autocomplete="off"
        >

        <button id="unirseSala">
            UNIRSE A LA SALA
        </button>

        <div id="mensaje"></div>

    </div>


    <!-- JUEGO -->
    <div id="juego">

        <div id="informacion">
            <h2>
                SALA:
                <span id="codigoSala">-----</span>
            </h2>

            <div>
                Jugadores:
                <span id="cantidadJugadores">0</span>/4
            </div>
        </div>

        <canvas id="cancha"></canvas>

    </div>


    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <script>

        // =========================================================
        // SOCKET
        // =========================================================

        const socket = io();


        // =========================================================
        // ELEMENTOS
        // =========================================================

        const menu = document.getElementById("menu");
        const juego = document.getElementById("juego");

        const crearSalaBtn = document.getElementById("crearSala");
        const unirseSalaBtn = document.getElementById("unirseSala");

        const codigoInput = document.getElementById("codigoInput");
        const mensaje = document.getElementById("mensaje");

        const codigoSala = document.getElementById("codigoSala");
        const cantidadJugadores = document.getElementById("cantidadJugadores");

        const canvas = document.getElementById("cancha");
        const ctx = canvas.getContext("2d");


        // =========================================================
        // MAPA
        // =========================================================

        const CELL = 20;

        const MAP = [
            "#######################################",
            "#P        #       #       #          #",
            "#         #       #       #          #",
            "#         #       #       #          #",
            "#         ###     #     ###      ######",
            "#                                   ##",
            "#                                   ##",
            "###   #########       #########    ##",
            "#     #                         #    #",
            "#     #       ###########       #    #",
            "#     #       #         #       #    #",
            "#             #         #            #",
            "#             #         #            #",
            "#     #       #         #       #    #",
            "#     #       ###########       #    #",
            "#     #                         #    #",
            "###   #########       #########    ##",
            "#                                   ##",
            "#                                   ##",
            "#         ###     #     ###         ##",
            "#         #       #       #         ##",
            "#         #       #       #         ##",
            "#         #       #       #         ##",
            "#         #       #       #         ##",
            "#                                   ##",
            "#      ######           ######      ##",
            "#      #                     #      ##",
            "#      #                     #      ##",
            "#                                   ##",
            "#                                   ##",
            "#######################################"
        ];

        const ROWS = MAP.length;
        const COLS = MAP[0].length;

        canvas.width = COLS * CELL;
        canvas.height = ROWS * CELL;


        // =========================================================
        // JUGADORES
        // =========================================================

        let jugadores = [];

        let miId = null;

        let salaActual = null;

        let jugadorLocal = {
            x: 30,
            y: 30
        };


        // =========================================================
        // CONEXIÓN
        // =========================================================

        socket.on("connect", () => {

            miId = socket.id;

            console.log("Conectado al servidor:", miId);

        });


        socket.on("disconnect", () => {

            console.log("Desconectado del servidor");

        });


        // =========================================================
        // CREAR SALA
        // =========================================================

        crearSalaBtn.addEventListener("click", () => {

            mensaje.textContent = "Creando sala...";

            socket.emit("crearSala");

        });


        // =========================================================
        // UNIRSE
        // =========================================================

        unirseSalaBtn.addEventListener("click", () => {

            const codigo = codigoInput.value
                .trim()
                .toUpperCase();

            if (codigo.length !== 5) {

                mensaje.textContent =
                    "El código debe tener 5 caracteres.";

                return;
            }

            mensaje.textContent = "Conectando...";

            socket.emit("unirseSala", codigo);

        });


        codigoInput.addEventListener("keydown", (e) => {

            if (e.key === "Enter") {

                unirseSalaBtn.click();

            }

        });


        // =========================================================
        // SALA CREADA
        // =========================================================

        socket.on("salaCreada", (datos) => {

            console.log("Sala creada:", datos);

            if (!datos || !datos.codigo) {

                mensaje.textContent =
                    "El servidor devolvió datos incorrectos.";

                return;
            }

            entrarAlJuego(datos.codigo);

        });


        // =========================================================
        // SALA UNIDA
        // =========================================================

        socket.on("salaUnida", (datos) => {

            console.log("Sala unida:", datos);

            if (!datos || !datos.codigo) {

                mensaje.textContent =
                    "El servidor devolvió datos incorrectos.";

                return;
            }

            entrarAlJuego(datos.codigo);

        });


        // =========================================================
        // ERROR DE SALA
        // =========================================================

        socket.on("errorSala", (texto) => {

            console.log("Error de sala:", texto);

            mensaje.textContent =
                texto || "No se pudo entrar a la sala.";

        });


        // =========================================================
        // ENTRAR AL JUEGO
        // =========================================================

        function entrarAlJuego(codigo) {

            salaActual = codigo;

            codigoSala.textContent = codigo;

            menu.style.display = "none";

            juego.style.display = "flex";

            console.log("Entraste a la sala:", codigo);

        }


        // =========================================================
        // ACTUALIZAR JUGADORES
        // =========================================================

        socket.on("actualizarJugadores", (lista) => {

            console.log(
                "Datos recibidos de jugadores:",
                lista
            );

            // MUY IMPORTANTE:
            // El servidor SIEMPRE debe mandar un ARRAY.

            if (!Array.isArray(lista)) {

                console.error(
                    "El servidor no envió un array:",
                    lista
                );

                return;
            }

            jugadores = lista;

            cantidadJugadores.textContent =
                jugadores.length;

            // Buscar nuestro jugador

            const yo = jugadores.find(
                jugador => jugador.id === miId
            );

            if (yo) {

                jugadorLocal.x = yo.x;

                jugadorLocal.y = yo.y;

            }

        });


        // =========================================================
        // MAPA
        // =========================================================

        function esPared(x, y) {

            const col = Math.floor(x / CELL);
            const row = Math.floor(y / CELL);

            if (
                row < 0 ||
                row >= ROWS ||
                col < 0 ||
                col >= COLS
            ) {

                return true;

            }

            return MAP[row][col] === "#";

        }


        // =========================================================
        // COLISIÓN
        // =========================================================

        function puedeMoverse(x, y) {

            const radio = 8;

            if (esPared(x - radio, y - radio)) return false;
            if (esPared(x + radio, y - radio)) return false;
            if (esPared(x - radio, y + radio)) return false;
            if (esPared(x + radio, y + radio)) return false;

            return true;

        }


        // =========================================================
        // TECLAS
        // =========================================================

        const teclas = {};

        window.addEventListener("keydown", (e) => {

            teclas[e.key.toLowerCase()] = true;

        });

        window.addEventListener("keyup", (e) => {

            teclas[e.key.toLowerCase()] = false;

        });


        // =========================================================
        // MOVIMIENTO
        // =========================================================

        let ultimoEnvio = 0;

        function actualizarMovimiento(dt) {

            if (!salaActual) return;

            let dx = 0;
            let dy = 0;

            if (
                teclas["w"] ||
                teclas["arrowup"]
            ) {

                dy -= 1;

            }

            if (
                teclas["s"] ||
                teclas["arrowdown"]
            ) {

                dy += 1;

            }

            if (
                teclas["a"] ||
                teclas["arrowleft"]
            ) {

                dx -= 1;

            }

            if (
                teclas["d"] ||
                teclas["arrowright"]
            ) {

                dx += 1;

            }

            if (dx === 0 && dy === 0) return;


            // Normalizar diagonal

            const longitud =
                Math.sqrt(dx * dx + dy * dy);

            dx /= longitud;
            dy /= longitud;


            const velocidad = 220;

            const nuevoX =
                jugadorLocal.x +
                dx * velocidad * dt;

            const nuevoY =
                jugadorLocal.y +
                dy * velocidad * dt;


            // Movimiento X

            if (puedeMoverse(nuevoX, jugadorLocal.y)) {

                jugadorLocal.x = nuevoX;

            }


            // Movimiento Y

            if (puedeMoverse(jugadorLocal.x, nuevoY)) {

                jugadorLocal.y = nuevoY;

            }


            // Enviar posición al servidor
            // máximo unas 30 veces por segundo

            const ahora = performance.now();

            if (ahora - ultimoEnvio > 33) {

                ultimoEnvio = ahora;

                socket.emit("moverJugador", {

                    x: jugadorLocal.x,
                    y: jugadorLocal.y

                });

            }

        }


        // =========================================================
        // DIBUJAR MAPA
        // =========================================================

        function dibujarMapa() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            for (let fila = 0; fila < ROWS; fila++) {

                for (let columna = 0; columna < COLS; columna++) {

                    const x = columna * CELL;
                    const y = fila * CELL;

                    if (MAP[fila][columna] === "#") {

                        ctx.fillStyle = "#28105f";

                        ctx.fillRect(
                            x,
                            y,
                            CELL,
                            CELL
                        );

                        ctx.strokeStyle = "#713cff";

                        ctx.strokeRect(
                            x,
                            y,
                            CELL,
                            CELL
                        );

                    } else {

                        ctx.fillStyle = "#050505";

                        ctx.fillRect(
                            x,
                            y,
                            CELL,
                            CELL
                        );

                    }

                }

            }

        }


        // =========================================================
        // DIBUJAR JUGADORES
        // =========================================================

        function dibujarJugadores() {

            if (!Array.isArray(jugadores)) {

                return;

            }


            jugadores.forEach((jugador, indice) => {

                if (
                    typeof jugador.x !== "number" ||
                    typeof jugador.y !== "number"
                ) {

                    return;

                }


                // Nuestro jugador

                if (jugador.id === miId) {

                    ctx.fillStyle = "#ffe600";

                } else {

                    // Otros jugadores

                    const colores = [
                        "#ff3030",
                        "#00eaff",
                        "#ff7b00",
                        "#00ff66"
                    ];

                    ctx.fillStyle =
                        colores[indice % colores.length];

                }


                ctx.beginPath();

                ctx.arc(
                    jugador.x,
                    jugador.y,
                    8,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                // Borde

                ctx.strokeStyle = "white";

                ctx.lineWidth = 2;

                ctx.stroke();

            });

        }


        // =========================================================
        // GAME LOOP
        // =========================================================

        let ultimoTiempo = performance.now();

        function gameLoop(tiempo) {

            const dt =
                Math.min(
                    (tiempo - ultimoTiempo) / 1000,
                    0.05
                );

            ultimoTiempo = tiempo;


            actualizarMovimiento(dt);

            dibujarMapa();

            dibujarJugadores();


            requestAnimationFrame(gameLoop);

        }

        requestAnimationFrame(gameLoop);

    </script>

</body>
</html>
