<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa 1</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
    background: #000;
    image-rendering: pixelated;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const CELL = 20;

/* =====================================================
   MAPA
   ===================================================== */

const MAP = [

"#######################################",
"#P        #       #       #          #",
"#         #       #       #          #",
"#         #       #       #          #",
"#         ###     #     ###      ######",
"#                                   ##",
"#                                   ##",
"###   #########       #########    ##",
"#     #                         #    #",
"#     #       ###########       #    #",
"#     #       #         #       #    #",
"#             #         #            #",
"#             #         #            #",
"#     #       #         #       #    #",
"#     #       ###########       #    #",
"#     #                         #    #",
"###   #########       #########    ##",
"#                                   ##",
"#                                   ##",
"#         ###     #     ###         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#         #       #       #         ##",
"#                                   ##",
"#      ######           ######      ##",
"#      #                     #      ##",
"#      #                     #      ##",
"#                                   ##",
"#                                   ##",
"#######################################"

];

const ROWS = MAP.length;
const COLS = MAP[0].length;

canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;


/* =====================================================
   JUGADOR
   ===================================================== */

const player = {

    x: 0,
    y: 0,

    radius: 8,

    speed: 220,

    directionX: 0,
    directionY: 0

};


/* =====================================================
   TECLAS
   ===================================================== */

const keys = {
    up: false,
    down: false,
    left: false,
    right: false
};


/* =====================================================
   POSICIÓN INICIAL
   ===================================================== */

function findPlayerStart() {

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            if (MAP[y][x] === "P") {

                player.x =
                    x * CELL + CELL / 2;

                player.y =
                    y * CELL + CELL / 2;

                return;
            }
        }
    }
}

findPlayerStart();


/* =====================================================
   TECLADO
   ===================================================== */

document.addEventListener("keydown", function(event) {

    const key = event.key.toLowerCase();

    if (
        key === "w" ||
        key === "a" ||
        key === "s" ||
        key === "d" ||
        key === "arrowup" ||
        key === "arrowdown" ||
        key === "arrowleft" ||
        key === "arrowright"
    ) {
        event.preventDefault();
    }

    if (key === "w" || key === "arrowup") {
        keys.up = true;
    }

    if (key === "s" || key === "arrowdown") {
        keys.down = true;
    }

    if (key === "a" || key === "arrowleft") {
        keys.left = true;
    }

    if (key === "d" || key === "arrowright") {
        keys.right = true;
    }

    updateDirection();
});


document.addEventListener("keyup", function(event) {

    const key = event.key.toLowerCase();

    if (key === "w" || key === "arrowup") {
        keys.up = false;
    }

    if (key === "s" || key === "arrowdown") {
        keys.down = false;
    }

    if (key === "a" || key === "arrowleft") {
        keys.left = false;
    }

    if (key === "d" || key === "arrowright") {
        keys.right = false;
    }

    updateDirection();
});


/* =====================================================
   DIRECCIÓN
   ===================================================== */

function updateDirection() {

    let dx = 0;
    let dy = 0;

    if (keys.left) dx--;
    if (keys.right) dx++;
    if (keys.up) dy--;
    if (keys.down) dy++;

    /* Velocidad diagonal normal */

    if (dx !== 0 && dy !== 0) {

        const length =
            Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;
    }

    player.directionX = dx;
    player.directionY = dy;
}


/* =====================================================
   DETECTAR PARED
   ===================================================== */

function isWall(x, y) {

    const col = Math.floor(x / CELL);
    const row = Math.floor(y / CELL);

    if (
        row < 0 ||
        row >= ROWS ||
        col < 0 ||
        col >= COLS
    ) {
        return true;
    }

    return MAP[row][col] === "#";
}


/* =====================================================
   COLISIONES
   ===================================================== */

function canMove(x, y) {

    const r = player.radius;

    return (
        !isWall(x - r, y - r) &&
        !isWall(x + r, y - r) &&
        !isWall(x - r, y + r) &&
        !isWall(x + r, y + r)
    );
}


/* =====================================================
   MOVIMIENTO
   ===================================================== */

function updatePlayer(delta) {

    const moveX =
        player.directionX *
        player.speed *
        delta;

    const moveY =
        player.directionY *
        player.speed *
        delta;

    const nextX =
        player.x + moveX;

    if (canMove(nextX, player.y)) {
        player.x = nextX;
    }

    const nextY =
        player.y + moveY;

    if (canMove(player.x, nextY)) {
        player.y = nextY;
    }
}


/* =====================================================
   DIBUJAR MAPA
   ===================================================== */

function drawMap() {

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            const tile = MAP[y][x];

            if (tile === "#") {

                ctx.fillStyle = "#28105f";

                ctx.fillRect(
                    x * CELL,
                    y * CELL,
                    CELL,
                    CELL
                );

                ctx.strokeStyle = "#713cff";
                ctx.lineWidth = 2;

                ctx.strokeRect(
                    x * CELL + 1,
                    y * CELL + 1,
                    CELL - 2,
                    CELL - 2
                );

            } else {

                ctx.fillStyle = "#000";

                ctx.fillRect(
                    x * CELL,
                    y * CELL,
                    CELL,
                    CELL
                );
            }
        }
    }
}


/* =====================================================
   DIBUJAR JUGADOR
   ===================================================== */

function drawPlayer() {

    /* Aura */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius + 6,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(255,255,0,0.15)";

    ctx.fill();


    /* Pelota */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ffff00";

    ctx.fill();


    /* Brillo */

    ctx.beginPath();

    ctx.arc(
        player.x - 2.5,
        player.y - 2.5,
        2,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#fff";

    ctx.fill();
}


/* =====================================================
   DIBUJAR TODO
   ===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMap();
    drawPlayer();
}


/* =====================================================
   GAME LOOP
   ===================================================== */

let lastTime = performance.now();

function gameLoop(currentTime) {

    let delta =
        (currentTime - lastTime) / 1000;

    lastTime = currentTime;

    if (delta > 0.05) {
        delta = 0.05;
    }

    updatePlayer(delta);
    draw();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
